
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10101a">
  <title>PinzTik — Media Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      background: #10101a;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 520px; margin: 30px auto; }
    .logo { color: #a78bfa; font-size: 30px; font-weight: 800; }
    .card {
      background: #1b1b29;
      border: 1px solid #343448;
      padding: 22px;
      border-radius: 18px;
      margin-top: 22px;
    }
    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }
    input, select {
      background: #11111c;
      color: white;
      border: 1px solid #414158;
    }
    button {
      border: 0;
      background: #8b5cf6;
      color: white;
      font-weight: bold;
    }
    .hint { color: #b8b8cc; font-size: 14px; line-height: 1.6; }
    #status { overflow-wrap: anywhere; }
    footer { margin-top: 24px; color: #9999af; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">⚡ PinzTik</div>
    <p class="hint">Pengunduh media milik sendiri atau yang diizinkan.</p>

    <section class="card">
      <h2>Media Downloader</h2>
      <label for="mediaUrl">URL file media langsung</label>
      <input id="mediaUrl" type="url"
        placeholder="https://contoh.com/video.mp4">
      <label for="format">Format</label>
      <select id="format">
        <option value="mp4">Video MP4</option>
        <option value="mp3">Audio MP3</option>
      </select>
      <button id="check">Periksa backend</button>
      <p id="status" class="hint">Menghubungkan ke server…</p>
      <p class="hint">
        Backend belum menyediakan konversi atau unduhan.
        Gunakan tautan file langsung yang memang boleh kamu unduh.
      </p>
    </section>

    <footer>PinzTik • Gunakan media secara bertanggung jawab.</footer>
  </main>

  <script>
    const status = document.getElementById("status");

    async function checkBackend() {
      status.textContent = "Memeriksa server…";
      try {
        const response = await fetch("/api/health");
        if (!response.ok) throw new Error("Server error");
        const data = await response.json();
        status.textContent =
          "Backend " + data.app + ": " + data.status;
      } catch (error) {
        status.textContent =
          "Backend belum terhubung. Pastikan server sudah aktif.";
      }
    }

    document.getElementById("check")
      .addEventListener("click", checkBackend);

    checkBackend();
  </script>
</body>
  </html>
